baseURL = "https://projectodevida.org/"
theme   = "pdv"
title   = "Projecto de Vida"
buildFuture = true

[params]
  domain  = "projectodevida.org"
  contact = "info@projectodevida.org"
  github  = "https://github.com/projectodevida/projectodevida"

[[menus.main]]
  name   = "index"
  url    = "/"
  weight = 1
[[menus.main]]
  name   = "editions"
  url    = "/editions/"
  weight = 2
[[menus.main]]
  name   = "blog"
  url    = "/blog/"
  weight = 3
[[menus.main]]
  name   = "refs"
  url    = "/resources/"
  weight = 4
[[menus.main]]
  name   = "info"
  url    = "/info/"
  weight = 5
[[menus.main]]
  name   = "rss"
  url    = "/feed.xml"
  weight = 6

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      footnote = true
    [markup.goldmark.renderer]
      unsafe = true
      hardWraps = true

[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page    = ["HTML"]

[outputFormats]
  [outputFormats.RSS]
    mediaType = "application/rss+xml"
    baseName  = "feed"

[taxonomies]
  tag = "tags"
